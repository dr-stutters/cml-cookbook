name: release

# Tags and releases every recipe whose current version has no tag yet.
on:
  push:
    branches: [main]
    paths: ["recipes/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the cookbook CLI
        run: pip install -e .

      - name: Validate before releasing
        run: cookbook validate

      - name: Tag and release new recipe versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cookbook release-plan --json > "$RUNNER_TEMP/plan.json"
          if [ "$(jq length "$RUNNER_TEMP/plan.json")" -eq 0 ]; then
            echo "Every recipe version is already tagged."
            exit 0
          fi
          jq -c '.[]' "$RUNNER_TEMP/plan.json" | while read -r entry; do
            id=$(jq -r .id <<<"$entry")
            version=$(jq -r .version <<<"$entry")
            tag=$(jq -r .tag <<<"$entry")
            path=$(jq -r .path <<<"$entry")
            jq -r .notes <<<"$entry" > "$RUNNER_TEMP/notes.md"
            assets=("$RUNNER_TEMP/${id}-v${version}.zip")
            (cd "$(dirname "$path")" && python -m zipfile -c "${assets[0]}" "$(basename "$path")")
            if [ "$(jq -r .renderable <<<"$entry")" = "true" ]; then
              lab="$RUNNER_TEMP/${id}-v${version}.yaml"
              cookbook render "$id" -o "$lab"
              assets+=("$lab")
              printf '\n\n**To build this lab:** download `%s`, import it in CML (Dashboard > Import), and start it.\n' \
                "$(basename "$lab")" >> "$RUNNER_TEMP/notes.md"
            else
              printf '\n\n**To build this lab:** it needs values from your own environment, so render it yourself with `cookbook render %s --input name=value -o lab.yaml`. The recipe README lists the inputs.\n' \
                "$id" >> "$RUNNER_TEMP/notes.md"
            fi
            flags=(--latest=false)
            if [ "$(jq -r .prerelease <<<"$entry")" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$id v$version" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${flags[@]}"
            echo "Released $tag"
          done
