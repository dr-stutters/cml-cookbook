hostname r1
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
router ospf 1
 router-id 10.255.0.1
!
interface Loopback0
 description router ID
 ip address 10.255.0.1 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/1
 description to r2 Ethernet0/1
 ip address 10.1.2.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description to r3 Ethernet0/1
 ip address 10.1.3.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
