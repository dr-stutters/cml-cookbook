hostname isp4
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
interface Loopback0
 description router ID
 ip address 10.255.0.4 255.255.255.255
!
interface Loopback1
 description stand-in for the internet behind ISP B
 ip address 198.51.100.129 255.255.255.128
!
interface Ethernet0/1
 description to edge2 Ethernet0/2
 ip address 10.2.4.4 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 description to isp3 Ethernet0/2
 ip address 10.3.4.4 255.255.255.0
 no shutdown
!
router bgp 64504
 bgp router-id 10.255.0.4
 bgp log-neighbor-changes
 neighbor 10.2.4.2 remote-as 65001
 neighbor 10.2.4.2 description customer edge2
 neighbor 10.3.4.3 remote-as 64503
 neighbor 10.3.4.3 description peer isp3 (ISP A)
 !
 address-family ipv4
  network 198.51.100.128 mask 255.255.255.128
  neighbor 10.2.4.2 activate
  neighbor 10.3.4.3 activate
 exit-address-family
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
