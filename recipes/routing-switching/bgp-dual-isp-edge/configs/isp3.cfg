hostname isp3
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
router bgp 64503
 bgp router-id 10.255.0.3
 bgp log-neighbor-changes
 neighbor 10.1.3.1 remote-as 65001
 neighbor 10.1.3.1 description customer edge1
 neighbor 10.3.4.4 remote-as 64504
 neighbor 10.3.4.4 description peer isp4 (ISP B)
 !
 address-family ipv4
  network 198.51.100.0 mask 255.255.255.128
  neighbor 10.1.3.1 activate
  neighbor 10.3.4.4 activate
 exit-address-family
!
interface Loopback0
 description router ID
 ip address 10.255.0.3 255.255.255.255
!
interface Loopback1
 description stand-in for the internet behind ISP A
 ip address 198.51.100.1 255.255.255.128
!
interface Ethernet0/1
 description to edge1 Ethernet0/2
 ip address 10.1.3.3 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 description to isp4 Ethernet0/2
 ip address 10.3.4.3 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
