hostname edge1
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
ip prefix-list ENTERPRISE seq 10 permit 203.0.113.0/24
!
route-map ISP-A-IN permit 10
 description ISP A is primary for outbound traffic
 set local-preference 200
!
route-map ISP-A-OUT permit 10
 description advertise only our own block, never transit
 match ip address prefix-list ENTERPRISE
!
router ospf 1
 router-id 10.255.0.1
!
interface Loopback0
 description router ID and iBGP source
 ip address 10.255.0.1 255.255.255.255
 ip ospf 1 area 0
!
interface Loopback1
 description stand-in for a server in the enterprise block
 ip address 203.0.113.1 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/1
 description to edge2 Ethernet0/1
 ip address 10.1.2.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description to isp3 Ethernet0/1
 ip address 10.1.3.1 255.255.255.0
 no shutdown
!
ip route 203.0.113.0 255.255.255.0 Null0 name ENTERPRISE-BLOCK
!
router bgp 65001
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 neighbor 10.255.0.2 remote-as 65001
 neighbor 10.255.0.2 description iBGP to edge2
 neighbor 10.255.0.2 update-source Loopback0
 neighbor 10.1.3.3 remote-as 64503
 neighbor 10.1.3.3 description eBGP to isp3 (ISP A)
 !
 address-family ipv4
  network 203.0.113.0 mask 255.255.255.0
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  neighbor 10.1.3.3 activate
  neighbor 10.1.3.3 route-map ISP-A-IN in
  neighbor 10.1.3.3 route-map ISP-A-OUT out
 exit-address-family
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
