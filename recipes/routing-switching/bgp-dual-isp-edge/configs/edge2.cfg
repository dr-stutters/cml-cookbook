hostname edge2
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
ip prefix-list ENTERPRISE seq 10 permit 203.0.113.0/24
!
route-map ISP-B-OUT permit 10
 description advertise only our own block, made less attractive by prepending
 match ip address prefix-list ENTERPRISE
 set as-path prepend 65001 65001
!
router ospf 1
 router-id 10.255.0.2
!
router bgp 65001
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 description iBGP to edge1
 neighbor 10.255.0.1 update-source Loopback0
 neighbor 10.2.4.4 remote-as 64504
 neighbor 10.2.4.4 description eBGP to isp4 (ISP B)
 !
 address-family ipv4
  network 203.0.113.0 mask 255.255.255.0
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  neighbor 10.2.4.4 activate
  neighbor 10.2.4.4 route-map ISP-B-OUT out
 exit-address-family
!
interface Loopback0
 description router ID and iBGP source
 ip address 10.255.0.2 255.255.255.255
 ip ospf 1 area 0
!
interface Loopback1
 description stand-in for a server in the enterprise block
 ip address 203.0.113.2 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/1
 description to edge1 Ethernet0/1
 ip address 10.1.2.2 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description to isp4 Ethernet0/1
 ip address 10.2.4.2 255.255.255.0
 no shutdown
!
ip route 203.0.113.0 255.255.255.0 Null0 name ENTERPRISE-BLOCK
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
