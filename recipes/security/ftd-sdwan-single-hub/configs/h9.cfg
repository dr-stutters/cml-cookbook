hostname h9
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
interface Ethernet0/1
 description to spoke2 GigabitEthernet0/3 (spoke2's inside LAN)
 ip address 172.16.2.9 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 172.16.2.1 name FIREWALL
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
