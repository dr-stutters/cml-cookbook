schema_version: 1
id: ftd-sdwan-single-hub
title: FTD SD-WAN with one hub
version: 0.1.0
status: draft
summary: >-
  Secure Firewall SD-WAN with one hub and three spokes on FTDv, managed by an FMC you already
  have: three simulated carriers, a hub-and-spoke IPsec overlay over virtual tunnel interfaces with
  iBGP generated by FMC's SD-WAN wizard, and a backup tunnel over a second carrier for two spokes.
level: advanced
tags: [firewall, ftd, fmc, sdwan, ipsec, vti, bgp, hub-and-spoke]
maintainers: [dr-stutters]

requirements:
  cml_min_version: "2.7"
  # ram_mb: fill in after a real run has measured it
  images:
    - node_definition: ftdv
      refplat: false
      source: https://software.cisco.com/download/home (Secure Firewall Threat Defense Virtual, KVM image, added to CML as an image definition)
      notes: >-
        Tested with FTDv 10.0.0. Four FTDv nodes at 8 GB of RAM each. Your FMC must run the same
        version or a newer one.
    - node_definition: iol-xe
      refplat: true
    - node_definition: external_connector
      refplat: true
    - node_definition: unmanaged_switch
      refplat: true
  external:
    - name: fmc
      description: >-
        An existing Secure Firewall Management Center that the management network reaches, with
        free capacity for four devices. It must be registered to a Smart Account with
        Export-Controlled Features enabled: FMC won't deploy the strong IPsec encryption the
        SD-WAN tunnels use in evaluation mode. The lab doesn't include an FMC.
      min_version: "7.6"
    - name: management-network
      description: >-
        A network the external connector's bridge (System Bridge) reaches, with four free
        addresses for the FTDs' Management0/0 ports, and a route to the FMC.

inputs:
  - name: admin_password
    description: >-
      Password for the admin user on the four FTDs (CLI). FTD needs a strong one: at least 8
      characters with upper and lower case, a digit and a symbol, and no dictionary words. Avoid
      " and \, which would break the day-0 JSON.
    type: secret
  - name: fmc_ip
    description: Management address of your FMC
    type: ipv4
    example: 198.18.134.76
  - name: hub1_mgmt_ip
    description: Address for hub1's Management0/0 port on your management network
    type: ipv4
    example: 198.18.128.224
  - name: spoke2_mgmt_ip
    description: Address for spoke2's Management0/0 port
    type: ipv4
    example: 198.18.128.225
  - name: spoke3_mgmt_ip
    description: Address for spoke3's Management0/0 port
    type: ipv4
    example: 198.18.128.226
  - name: spoke4_mgmt_ip
    description: Address for spoke4's Management0/0 port
    type: ipv4
    example: 198.18.128.227
  - name: mgmt_mask
    description: Subnet mask of the management network
    type: ipv4
    example: 255.255.192.0
  - name: mgmt_gateway
    description: Default gateway on the management network
    type: ipv4
    example: 198.18.128.1
  - name: mgmt_dns
    description: DNS server the FTDs use
    type: ipv4
    example: 198.18.133.1

addressing:
  - prefix: 10.5.0.0/16
    purpose: >-
      isp5, the MPLS-like carrier. 10.5.N.0/24 to the FTD numbered N (FTD .N, isp5 .5). The FTDs'
      interface is called mpls.
  - prefix: 10.6.0.0/16
    purpose: isp6, the internet carrier. 10.6.N.0/24 to FTD N (FTD .N, isp6 .6). Interface inet.
  - prefix: 10.7.0.0/16
    purpose: >-
      isp7, the LTE-like carrier. 10.7.N.0/24 to FTD N (FTD .N, isp7 .7). Interface lte. Built
      and routed, but no tunnel uses it.
  - prefix: 172.16.1.0/24
    purpose: hub1 inside LAN (hub1 .1, h8 .8)
  - prefix: 172.16.2.0/24
    purpose: spoke2 inside LAN (spoke2 .1, h9 .9)
  - prefix: 172.16.3.0/24
    purpose: spoke3 inside LAN (spoke3 .1, h10 .10)
  - prefix: 172.16.4.0/24
    purpose: spoke4 inside LAN (spoke4 .1, h11 .11)
  - prefix: 10.255.1.0/24
    purpose: >-
      Overlay over mpls. hub1's tunnel borrows 10.255.1.1 from a loopback; FMC gives each spoke
      tunnel an address from the pool 10.255.1.2-10.255.1.254.
  - prefix: 10.255.2.0/24
    purpose: Backup overlay over inet, the same way (hub1 10.255.2.1, pool 10.255.2.2-10.255.2.254)

topology:
  nodes:
    - label: ext
      node_definition: external_connector
      role: Bridges the management switch to your network
      config: System Bridge
      x: -800
      y: -600
    - label: ums
      node_definition: unmanaged_switch
      role: Management segment for the four FTDs
      x: -800
      y: -400
    - label: h8
      node_definition: iol-xe
      role: Host on hub1's inside LAN (an IOL router standing in for a PC)
      config_file: configs/h8.cfg
      x: 0
      y: -600
    - label: hub1
      node_definition: ftdv
      role: SD-WAN hub, terminates every spoke's tunnels on dynamic VTIs
      config_file: configs/hub1.json
      login:
        username: admin
        password: "{{ inputs.admin_password }}"
      x: 0
      y: -400
    - label: isp5
      node_definition: iol-xe
      role: MPLS-like carrier, connects all four sites
      config_file: configs/isp5.cfg
      x: -400
      y: -200
    - label: isp6
      node_definition: iol-xe
      role: Internet carrier, connects all four sites
      config_file: configs/isp6.cfg
      x: 0
      y: -200
    - label: isp7
      node_definition: iol-xe
      role: LTE-like carrier, connects all four sites
      config_file: configs/isp7.cfg
      x: 400
      y: -200
    - label: spoke2
      node_definition: ftdv
      role: Branch with a primary tunnel over mpls and a backup over inet
      config_file: configs/spoke2.json
      login:
        username: admin
        password: "{{ inputs.admin_password }}"
      x: -400
      y: 0
    - label: spoke3
      node_definition: ftdv
      role: Branch with a primary tunnel over mpls and a backup over inet
      config_file: configs/spoke3.json
      login:
        username: admin
        password: "{{ inputs.admin_password }}"
      x: 0
      y: 0
    - label: spoke4
      node_definition: ftdv
      role: Branch with a single tunnel over mpls
      config_file: configs/spoke4.json
      login:
        username: admin
        password: "{{ inputs.admin_password }}"
      x: 400
      y: 0
    - label: h9
      node_definition: iol-xe
      role: Host on spoke2's inside LAN
      config_file: configs/h9.cfg
      x: -400
      y: 200
    - label: h10
      node_definition: iol-xe
      role: Host on spoke3's inside LAN
      config_file: configs/h10.cfg
      x: 0
      y: 200
    - label: h11
      node_definition: iol-xe
      role: Host on spoke4's inside LAN
      config_file: configs/h11.cfg
      x: 400
      y: 200
  links:
    - a: ext:port
      b: ums:port0
      description: Management network, bridged out of CML
    - a: hub1:Management0/0
      b: ums:port1
      description: hub1 management, how it reaches FMC
    - a: spoke2:Management0/0
      b: ums:port2
      description: spoke2 management
    - a: spoke3:Management0/0
      b: ums:port3
      description: spoke3 management
    - a: spoke4:Management0/0
      b: ums:port4
      description: spoke4 management
    - a: hub1:GigabitEthernet0/0
      b: isp5:Ethernet0/1
      description: hub1 mpls, 10.5.1.0/24 (FMC calls the FTD port Ethernet0/0)
    - a: spoke2:GigabitEthernet0/0
      b: isp5:Ethernet0/2
      description: spoke2 mpls, 10.5.2.0/24
    - a: spoke3:GigabitEthernet0/0
      b: isp5:Ethernet0/3
      description: spoke3 mpls, 10.5.3.0/24
    - a: spoke4:GigabitEthernet0/0
      b: isp5:Ethernet1/0
      description: spoke4 mpls, 10.5.4.0/24
    - a: hub1:GigabitEthernet0/1
      b: isp6:Ethernet0/1
      description: hub1 inet, 10.6.1.0/24 (FMC calls the FTD port Ethernet0/1)
    - a: spoke2:GigabitEthernet0/1
      b: isp6:Ethernet0/2
      description: spoke2 inet, 10.6.2.0/24
    - a: spoke3:GigabitEthernet0/1
      b: isp6:Ethernet0/3
      description: spoke3 inet, 10.6.3.0/24
    - a: spoke4:GigabitEthernet0/1
      b: isp6:Ethernet1/0
      description: spoke4 inet, 10.6.4.0/24
    - a: hub1:GigabitEthernet0/2
      b: isp7:Ethernet0/1
      description: hub1 lte, 10.7.1.0/24 (FMC calls the FTD port Ethernet0/2)
    - a: spoke2:GigabitEthernet0/2
      b: isp7:Ethernet0/2
      description: spoke2 lte, 10.7.2.0/24
    - a: spoke3:GigabitEthernet0/2
      b: isp7:Ethernet0/3
      description: spoke3 lte, 10.7.3.0/24
    - a: spoke4:GigabitEthernet0/2
      b: isp7:Ethernet1/0
      description: spoke4 lte, 10.7.4.0/24
    - a: hub1:GigabitEthernet0/3
      b: h8:Ethernet0/1
      description: hub1 inside, 172.16.1.0/24 (FMC calls the FTD port Ethernet0/3)
    - a: spoke2:GigabitEthernet0/3
      b: h9:Ethernet0/1
      description: spoke2 inside, 172.16.2.0/24
    - a: spoke3:GigabitEthernet0/3
      b: h10:Ethernet0/1
      description: spoke3 inside, 172.16.3.0/24
    - a: spoke4:GigabitEthernet0/3
      b: h11:Ethernet0/1
      description: spoke4 inside, 172.16.4.0/24

steps:
  - id: fmc-prerequisites
    title: Check that your FMC can build SD-WAN
    mode: manual
    instructions: |
      Log in to the FMC at https://{{ inputs.fmc_ip }}. Check:
        - Help > About shows version 7.6 or later (tested with 10.0.1).
        - System > Licenses > Smart Licenses shows the FMC registered to a Smart Account (not
          Evaluation Mode) with Export-Controlled Features: Enabled. With the REST API:
          GET /api/fmc_platform/v1/license/smartlicenses returns regStatus REGISTERED and
          exportControl true.
        - Nothing named sdwan-single-* exists yet (devices, zones, objects, policies or VPN
          topologies). Everything this recipe creates in FMC starts with that prefix, so it never
          touches anything else.
    verify: [fmc-export-controlled]
  - id: fmc-objects
    title: Create the zones, network objects and access control policy
    mode: manual
    instructions: |
      In FMC (Objects > Object Management, and Policies > Access Control):
        - Security zones, type Routed: sdwan-single-wan, sdwan-single-inside, sdwan-single-overlay.
        - Network objects: sdwan-single-mpls 10.5.0.0/16, sdwan-single-inet 10.6.0.0/16,
          sdwan-single-lte 10.7.0.0/16.
        - An access control policy named sdwan-single-acp with the default action
          "Access Control: Block All Traffic" and no rules yet. The rule that allows the overlay
          comes after the SD-WAN topology exists: until then the overlay zone has no interfaces and
          FMC warns about it on every deploy.
      REST: POST object/securityzones (interfaceMode ROUTED), object/networks and
      policy/accesspolicies under /api/fmc_config/v1/domain/{domainUUID}/.
  - id: fmc-register
    title: Register the four FTDs in FMC
    mode: manual
    instructions: |
      Every FTD already points at your FMC from its day-0 config (show managers lists it as
      Pending). In FMC, Devices > Device Management > Add > Device, once per FTD:

        | Display name          | Host                          |
        |-----------------------|-------------------------------|
        | sdwan-single-hub1     | {{ inputs.hub1_mgmt_ip }}     |
        | sdwan-single-spoke2   | {{ inputs.spoke2_mgmt_ip }}   |
        | sdwan-single-spoke3   | {{ inputs.spoke3_mgmt_ip }}   |
        | sdwan-single-spoke4   | {{ inputs.spoke4_mgmt_ip }}   |

      Registration key cookbook, no NAT ID, access control policy sdwan-single-acp, performance
      tier FTDv5, Essentials licence. Each registration and its first deployment take about 6
      minutes. REST: POST devices/devicerecords.
    verify: [hub1-registered, spoke2-registered, spoke3-registered, spoke4-registered]
  - id: fmc-interfaces-routes
    title: Configure the WAN and inside interfaces and a static route per carrier
    mode: manual
    instructions: |
      In FMC, edit each device's interfaces. FMC lists the data ports as Ethernet0/x, which CML
      calls GigabitEthernet0/x. Enable each one with a static IPv4 address:

        | Device | Ethernet0/0  | Ethernet0/1  | Ethernet0/2  | Ethernet0/3    |
        |--------|--------------|--------------|--------------|----------------|
        | name   | mpls         | inet         | lte          | inside         |
        | zone   | wan          | wan          | wan          | inside         |
        | hub1   | 10.5.1.1/24  | 10.6.1.1/24  | 10.7.1.1/24  | 172.16.1.1/24  |
        | spoke2 | 10.5.2.2/24  | 10.6.2.2/24  | 10.7.2.2/24  | 172.16.2.1/24  |
        | spoke3 | 10.5.3.3/24  | 10.6.3.3/24  | 10.7.3.3/24  | 172.16.3.1/24  |
        | spoke4 | 10.5.4.4/24  | 10.6.4.4/24  | 10.7.4.4/24  | 172.16.4.1/24  |

      The zones are sdwan-single-wan and sdwan-single-inside.

      Then, under Routing > Static Route on each device, add three IPv4 routes. N is the device's
      number (hub1 is 1, spoke2 is 2, and so on):
        - interface mpls, network sdwan-single-mpls, gateway 10.5.N.5
        - interface inet, network sdwan-single-inet, gateway 10.6.N.6
        - interface lte, network sdwan-single-lte, gateway 10.7.N.7
      Every carrier only knows its own connected links, so these routes are all the underlay
      needs. REST: PUT devices/devicerecords/{id}/physicalinterfaces/{id} and
      POST devices/devicerecords/{id}/routing/ipv4staticroutes.
  - id: fmc-deploy-underlay
    title: Deploy the underlay
    mode: manual
    instructions: |
      Deploy to the four sdwan-single-* devices (Deploy > Deployment) and wait until it succeeds.
      If FMC refuses with "another deployment in progress", the deployment it started after
      registration hasn't finished yet: wait a minute and try again.
    verify: [hub1-interfaces, spoke2-interfaces, spoke3-interfaces, spoke4-interfaces,
             spoke2-underlay-mpls, spoke2-underlay-inet, spoke2-underlay-lte]
  - id: fmc-sdwan-topology
    title: Build the SD-WAN topology over mpls
    mode: manual
    instructions: |
      Run FMC's SD-WAN wizard (Devices > VPN > Site To Site > + SD-WAN Topology) and create a
      topology named sdwan-single:
        - Hub: sdwan-single-hub1. Create its dynamic VTI: name sdwan-dvti, tunnel source mpls,
          security zone sdwan-single-overlay, borrowing its address from a new loopback
          sdwan-dvti-lo with 10.255.1.1/32. Spoke tunnel address pool: a new IPv4 address pool
          sdwan-single-pool, 10.255.1.2-10.255.1.254, mask 255.255.255.0.
        - Spokes: sdwan-single-spoke2, sdwan-single-spoke3 and sdwan-single-spoke4, each on its
          WAN interface mpls, with sdwan-single-overlay as the spoke tunnel zone.
        - Authentication: automatic pre-shared key. IKEv2 with FMC's default AES policies.
        - Routing: BGP on, AS 65000, community 1000, ECMP (multipath) on, redistributing the
          connected inside interfaces (hub1 and every spoke: inside).
      REST: POST policy/ftds2svpns with topologyType AUTO_VPN, routeBased true, ikeV2Enabled
      true and autoVpnSettings {routeSettings {enableBgp, autonomousSystemNumber 65000,
      communityAttribute 1000, communityTagToAdvertiseLearntRoutes 1000, enableMultiPath true,
      distributeConnectedNetwork {enableDistribution true, interfaceSelection INSIDE_INTERFACE}},
      spokeSvtiSecurityZone}. Use AUTO_VPN: FMC 10.0.1 silently drops autoVpnSettings with
      HUB_AND_SPOKE. Then POST .../endpoints once per device: peerType HUB with the DVTI as its
      interface and ipv4PoolsForSpokeVti, peerType SPOKE with the WAN interface; both with
      insideInterface. Create the pool (object/ipv4addresspools), loopback and DVTI first.
  - id: fmc-sdwan-backup-wan
    title: Add backup tunnels over inet for spoke2 and spoke3
    mode: manual
    instructions: |
      FMC 10.0.1 builds a spoke's second WAN tunnel as a second SD-WAN topology on the same hub.
      Run the wizard again and create sdwan-single-wan2:
        - Hub: sdwan-single-hub1 with a new dynamic VTI sdwan-dvti-wan2, tunnel source inet, zone
          sdwan-single-overlay, borrowing from a new loopback sdwan-dvti-wan2-lo with
          10.255.2.1/32. Pool: a new sdwan-single-wan2-pool, 10.255.2.2-10.255.2.254, mask
          255.255.255.0.
        - Spokes: sdwan-single-spoke2 and sdwan-single-spoke3 on inet.
        - The same authentication and routing settings as sdwan-single (AS 65000, community
          1000, multipath on). FMC merges both topologies into one BGP process per device.
      Setting backup interfaces on the spokes of a single AUTO_VPN topology doesn't work on FMC
      10.0.1: the API accepts it and stores nothing.
  - id: fmc-access-rule
    title: Allow traffic between the sites
    mode: manual
    instructions: |
      In sdwan-single-acp, add a rule named sdwan-single-allow-overlay: source zones
      sdwan-single-inside and sdwan-single-overlay, destination zones sdwan-single-inside and
      sdwan-single-overlay, action Allow. Everything else stays blocked by the default action.
      IKE, IPsec and BGP are traffic to the FTDs themselves, which the access policy doesn't
      inspect.
  - id: fmc-deploy-overlay
    title: Deploy the SD-WAN overlay
    mode: manual
    instructions: |
      Deploy to the four sdwan-single-* devices again and wait until it succeeds. The tunnels and
      BGP sessions come up within a minute or two. FMC's own tunnel status can show UNKNOWN for a
      few minutes after a deploy even when the tunnel is up; the checks read the FTDs directly.
    verify: [hub1-ikev2-sas, hub1-bgp, spoke2-bgp, spoke4-bgp, spoke4-bgp-routes]

checks:
  - id: fmc-export-controlled
    type: manual
    description: The FMC is 7.6 or later and licensed with Export-Controlled Features
    instructions: >-
      In FMC, System > Licenses > Smart Licenses shows a registered Smart Account with
      Export-Controlled Features enabled, and Help > About shows 7.6 or later. With the REST API,
      GET /api/fmc_platform/v1/license/smartlicenses returns regStatus REGISTERED and
      exportControl true.
  - id: hub1-registered
    type: cli_match
    description: hub1's registration with FMC has completed
    node: hub1
    command: show managers
    timeout: 900
    expect:
      pattern: 'Registration\s*:\s*Completed'
  - id: spoke2-registered
    type: cli_match
    description: spoke2's registration with FMC has completed
    node: spoke2
    command: show managers
    timeout: 900
    expect:
      pattern: 'Registration\s*:\s*Completed'
  - id: spoke3-registered
    type: cli_match
    description: spoke3's registration with FMC has completed
    node: spoke3
    command: show managers
    timeout: 900
    expect:
      pattern: 'Registration\s*:\s*Completed'
  - id: spoke4-registered
    type: cli_match
    description: spoke4's registration with FMC has completed
    node: spoke4
    command: show managers
    timeout: 900
    expect:
      pattern: 'Registration\s*:\s*Completed'
  - id: hub1-interfaces
    type: cli_match
    description: hub1's three WAN interfaces and its inside interface are up with the addresses FMC deployed
    node: hub1
    command: show interface ip brief
    expect:
      pattern: '\A(?=[\s\S]*Ethernet0/0\s+10\.5\.1\.1\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/1\s+10\.6\.1\.1\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/2\s+10\.7\.1\.1\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/3\s+172\.16\.1\.1\s+YES\s+\S+\s+up\s+up)'
  - id: spoke2-interfaces
    type: cli_match
    description: spoke2's interfaces are up with the addresses FMC deployed
    node: spoke2
    command: show interface ip brief
    expect:
      pattern: '\A(?=[\s\S]*Ethernet0/0\s+10\.5\.2\.2\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/1\s+10\.6\.2\.2\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/2\s+10\.7\.2\.2\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/3\s+172\.16\.2\.1\s+YES\s+\S+\s+up\s+up)'
  - id: spoke3-interfaces
    type: cli_match
    description: spoke3's interfaces are up with the addresses FMC deployed
    node: spoke3
    command: show interface ip brief
    expect:
      pattern: '\A(?=[\s\S]*Ethernet0/0\s+10\.5\.3\.3\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/1\s+10\.6\.3\.3\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/2\s+10\.7\.3\.3\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/3\s+172\.16\.3\.1\s+YES\s+\S+\s+up\s+up)'
  - id: spoke4-interfaces
    type: cli_match
    description: spoke4's interfaces are up with the addresses FMC deployed
    node: spoke4
    command: show interface ip brief
    expect:
      pattern: '\A(?=[\s\S]*Ethernet0/0\s+10\.5\.4\.4\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/1\s+10\.6\.4\.4\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/2\s+10\.7\.4\.4\s+YES\s+\S+\s+up\s+up)(?=[\s\S]*Ethernet0/3\s+172\.16\.4\.1\s+YES\s+\S+\s+up\s+up)'
  - id: spoke2-underlay-mpls
    type: ping
    description: spoke2 reaches hub1's mpls address across isp5, through the static routes on both ends
    node: spoke2
    target: 10.5.1.1
  - id: spoke2-underlay-inet
    type: ping
    description: spoke2 reaches hub1's inet address across isp6
    node: spoke2
    target: 10.6.1.1
  - id: spoke2-underlay-lte
    type: ping
    description: spoke2 reaches hub1's lte address across isp7
    node: spoke2
    target: 10.7.1.1
  - id: hub1-ikev2-sas
    type: cli_match
    description: hub1 has five IKEv2 SAs up, one per spoke over mpls and one each for spoke2 and spoke3 over inet
    node: hub1
    command: show crypto ikev2 sa
    expect:
      pattern: '\A(?=[\s\S]*10\.5\.2\.2/500\s+\S+\s+READY)(?=[\s\S]*10\.5\.3\.3/500\s+\S+\s+READY)(?=[\s\S]*10\.5\.4\.4/500\s+\S+\s+READY)(?=[\s\S]*10\.6\.2\.2/500\s+\S+\s+READY)(?=[\s\S]*10\.6\.3\.3/500\s+\S+\s+READY)'
  - id: hub1-bgp
    type: bgp_neighbors
    description: hub1 has an iBGP session over every spoke tunnel (three over mpls, two over inet)
    node: hub1
    expect:
      count: 5
  - id: spoke2-bgp
    type: bgp_neighbors
    description: spoke2 peers with hub1 over both tunnels, mpls and inet
    node: spoke2
    expect:
      count: 2
      neighbors: [10.255.1.1, 10.255.2.1]
  - id: spoke4-bgp
    type: bgp_neighbors
    description: spoke4 peers with hub1 over its single mpls tunnel
    node: spoke4
    expect:
      count: 1
      neighbors: [10.255.1.1]
  - id: spoke4-bgp-routes
    type: cli_match
    description: spoke4 learns the hub's LAN and the other spokes' LANs through hub1 over the overlay
    node: spoke4
    command: show route bgp
    expect:
      pattern: '\A(?=[\s\S]*172\.16\.1\.0 255\.255\.255\.0 \[\d+/\d+\] via 10\.255\.1\.1)(?=[\s\S]*172\.16\.2\.0 255\.255\.255\.0 \[\d+/\d+\] via 10\.255\.1\.1)(?=[\s\S]*172\.16\.3\.0 255\.255\.255\.0 \[\d+/\d+\] via 10\.255\.1\.1)'
  - id: ping-h9-h8
    type: ping
    description: spoke2's host reaches the hub's host over the overlay
    node: h9
    target: 172.16.1.8
  - id: ping-h10-h8
    type: ping
    description: spoke3's host reaches the hub's host over the overlay
    node: h10
    target: 172.16.1.8
  - id: ping-h11-h8
    type: ping
    description: spoke4's host reaches the hub's host over the overlay
    node: h11
    target: 172.16.1.8
  - id: ping-h9-h10
    type: ping
    description: Spoke to spoke through the hub, spoke2's host to spoke3's
    node: h9
    target: 172.16.3.10
  - id: ping-h9-h11
    type: ping
    description: Spoke to spoke through the hub, spoke2's host to spoke4's
    node: h9
    target: 172.16.4.11
  - id: ping-h10-h11
    type: ping
    description: Spoke to spoke through the hub, spoke3's host to spoke4's
    node: h10
