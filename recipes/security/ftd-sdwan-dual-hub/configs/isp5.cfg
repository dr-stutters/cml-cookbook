hostname isp5
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
interface Ethernet0/1
 description to hub1 GigabitEthernet0/0 (hub1's mpls WAN on the MPLS-like carrier)
 ip address 10.5.1.5 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 description to hub2 GigabitEthernet0/0 (hub2's mpls WAN on the MPLS-like carrier)
 ip address 10.5.2.5 255.255.255.0
 no shutdown
!
interface Ethernet0/3
 description to spoke3 GigabitEthernet0/0 (spoke3's mpls WAN on the MPLS-like carrier)
 ip address 10.5.3.5 255.255.255.0
 no shutdown
!
interface Ethernet1/0
 description to spoke4 GigabitEthernet0/0 (spoke4's mpls WAN on the MPLS-like carrier)
 ip address 10.5.4.5 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
