hostname isp6
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
interface Ethernet0/1
 description to hub1 GigabitEthernet0/1 (hub1's inet WAN on the internet carrier)
 ip address 10.6.1.6 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 description to hub2 GigabitEthernet0/1 (hub2's inet WAN on the internet carrier)
 ip address 10.6.2.6 255.255.255.0
 no shutdown
!
interface Ethernet0/3
 description to spoke3 GigabitEthernet0/1 (spoke3's inet WAN on the internet carrier)
 ip address 10.6.3.6 255.255.255.0
 no shutdown
!
interface Ethernet1/0
 description to spoke4 GigabitEthernet0/1 (spoke4's inet WAN on the internet carrier)
 ip address 10.6.4.6 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
