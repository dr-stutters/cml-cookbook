hostname isp7
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
interface Ethernet0/1
 description to hub1 GigabitEthernet0/2 (hub1's lte WAN on the LTE-like carrier)
 ip address 10.7.1.7 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 description to hub2 GigabitEthernet0/2 (hub2's lte WAN on the LTE-like carrier)
 ip address 10.7.2.7 255.255.255.0
 no shutdown
!
interface Ethernet0/3
 description to spoke3 GigabitEthernet0/2 (spoke3's lte WAN on the LTE-like carrier)
 ip address 10.7.3.7 255.255.255.0
 no shutdown
!
interface Ethernet1/0
 description to spoke4 GigabitEthernet0/2 (spoke4's lte WAN on the LTE-like carrier)
 ip address 10.7.4.7 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
