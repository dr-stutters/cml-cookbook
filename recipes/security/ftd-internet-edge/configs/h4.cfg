hostname h4
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
interface Ethernet0/1
 description to ftd2 GigabitEthernet0/1 (inside)
 ip address 10.2.4.4 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.2.4.2 name FIREWALL
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
