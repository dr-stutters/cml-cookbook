hostname isp3
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
interface Loopback0
 description router ID
 ip address 10.255.0.3 255.255.255.255
!
interface Loopback1
 description stand-in for a web server on the internet
 ip address 198.51.100.1 255.255.255.255
!
interface Loopback2
 description stand-in for a site the firewall policy blocks
 ip address 198.51.100.66 255.255.255.255
!
interface Ethernet0/1
 description to ftd2 GigabitEthernet0/0 (outside); no route back to the inside, so replies need NAT
 ip address 10.2.3.3 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
