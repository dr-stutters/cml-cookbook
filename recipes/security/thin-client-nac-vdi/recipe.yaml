schema_version: 1
id: thin-client-nac-vdi
title: Thin client NAC with per-user VDI VPN
version: 0.1.0
status: draft
summary: >-
  Two layers of access control for thin clients and VDI: ISE admits each thin client on a cat9000v
  access port (EAP-TLS, MAB fallback) to RDP only, and inside each Ubuntu xrdp desktop the user's
  Secure Client VPN to an FTDv gets a group policy and SGT from ISE that decide which apps they reach.
level: advanced
tags: [ise, dot1x, eap-tls, mab, trustsec, sgt, ftd, fmc, ravpn, secure-client, vdi, thin-client, cat9000v]
maintainers: [dr-stutters]

requirements:
  cml_min_version: "2.7"
  images:
    - node_definition: cat9000v-uadp
      refplat: true
      notes: Tested with Catalyst 9000v UADP 17.18.02 (C9KV-UADP-8P).
    - node_definition: ftdv
      refplat: false
      source: https://software.cisco.com/download/home (Secure Firewall Threat Defense Virtual, KVM image, added to CML as an image definition)
      notes: Tested with FTDv 10.0.0. Your FMC must run the same version or a newer one.
    - node_definition: ubuntu
      refplat: true
      notes: Tested with Ubuntu 24.04 (cloud-init).
    - node_definition: alpine
      refplat: true
    - node_definition: external_connector
      refplat: true
    - node_definition: unmanaged_switch
      refplat: true
  external:
    - name: ise
      description: >-
        An ISE deployment the management network reaches, joined to Active Directory, with the
        TrustSec SGTs it hands out downloaded by your FMC (the FMC's ISE/pxGrid identity source). Tested
        with ISE 3.5.
      min_version: "3.2"
    - name: fmc
      description: >-
        An existing Secure Firewall Management Center that the management network reaches, with room
        for one more device and a Secure Client Premier (or Advantage) entitlement. Evaluation mode is
        enough. FMC registers devices only in a leaf domain.
      min_version: "7.6"
    - name: active-directory-and-ca
      description: >-
        An Active Directory domain ISE is joined to, with two groups (VDI-Finance and VDI-General) and
        one test user in each, and a CA that ISE trusts and that can issue client-authentication
        certificates (for h3 and h4) and a server certificate for the VPN headend.
    - name: secure-client-packages
      description: >-
        Cisco Secure Client 5.1 for Linux x64, downloaded from Cisco by you: the webdeploy .pkg for the
        FMC and the full vpn .deb (from the predeploy-deb .tgz) for the two desktops. The recipe ships
        neither.
    - name: management-network
      description: >-
        A network the external connector's bridge (System Bridge) reaches, with three free addresses
        (acc1, ftd2 management, ftd2 services) and a path to ISE and the FMC.
    - name: internet
      description: >-
        CML's NAT connector must reach the internet: h3, h4, h6 and h7 install packages at boot
        (wpa_supplicant and FreeRDP, xrdp and XFCE). Nothing else uses that path.

inputs:
  - name: admin_password
    description: >-
      Password for the admin user on ftd2 (CLI). FTD needs a strong one: at least 8 characters with
      upper and lower case, a digit and a symbol, and no dictionary words. Avoid " and \, which would
      break the day-0 JSON.
    type: secret
  - name: fmc_ip
    description: Management address of your FMC
    type: ipv4
    example: 198.18.134.76
  - name: ise_ip
    description: Address of the ISE node acc1 and ftd2 send RADIUS to (and that sends CoA)
    type: ipv4
    example: 198.18.134.35
  - name: radius_key
    description: RADIUS shared secret for acc1 and ftd2 (the same one goes into both ISE network devices)
    type: secret
  - name: acc1_mgmt_ip
    description: Address for acc1's GigabitEthernet1/0/24 on your management network (its RADIUS source)
    type: ipv4
    example: 198.18.128.221
  - name: ftd2_mgmt_ip
    description: Address for ftd2's Management0/0 port on your management network
    type: ipv4
    example: 198.18.128.222
  - name: ftd2_services_ip
    description: >-
      Address for ftd2's services data interface (GigabitEthernet0/2) on your management network: its
      RADIUS source, and the address ISE sends CoA to
    type: ipv4
    example: 198.18.128.223
  - name: mgmt_mask
    description: Subnet mask of the management network
    type: ipv4
    example: 255.255.192.0
  - name: mgmt_gateway
    description: Default gateway on the management network
    type: ipv4
    example: 198.18.128.1
  - name: mgmt_dns
    description: DNS server ftd2 uses
    type: ipv4
    example: 198.18.133.1
  - name: ad_domain
    description: >-
      DNS name of your AD domain. The thin clients' certificates are issued to h3.<domain> and
      h4.<domain>.
    type: string
    example: corp.example.com
  - name: vpn_fqdn
    description: >-
      Name of the VPN headend (ftd2's outside address, 172.16.20.1). The desktops resolve it from
      /etc/hosts, and the headend's certificate is issued to it.
    type: string
    example: vpn.vdi.corp.example.com
  - name: vpn_user_finance
    description: An AD user in the VDI-Finance group, for the VPN from h6
    type: string
    example: alice
  - name: vpn_user_general
    description: An AD user in the VDI-General group (and not in VDI-Finance), for the VPN from h7
    type: string
    example: bob

addressing:
  - prefix: 172.16.110.0/24
    purpose: Thin clients, VLAN 110 on acc1, gateway and DHCP server ftd2 (172.16.110.1, pool .100-.199)
  - prefix: 172.16.20.0/24
    purpose: VDI desktops, VLAN 20 tagged in the guest; ftd2 outside 172.16.20.1 is gateway and VPN headend; h6 .6, h7 .7
  - prefix: 172.16.30.0/24
    purpose: Apps, untagged on ums3; ftd2 inside 172.16.30.1, srv8 .8 (Finance only), srv9 .9 (Finance and General)
  - prefix: 172.16.40.0/24
    purpose: Secure Client address pool, 172.16.40.10-172.16.40.200

topology:
  nodes:
    - label: ext1
      node_definition: external_connector
      role: Bridges acc1, ftd2's management port and ftd2's services port to your network, where ISE and the FMC are
      config: System Bridge
      x: 0
      y: -600
    - label: ums1
      node_definition: unmanaged_switch
      role: Management segment
      x: 0
      y: -400
    - label: acc1
      node_definition: cat9000v-uadp
      role: Access switch, IBNS 2.0 (802.1X then MAB, closed mode); RADIUS and CoA with ISE from GigabitEthernet1/0/24
      config_file: configs/acc1.cfg
      x: -400
      y: -200
    - label: ftd2
      node_definition: ftdv
      role: Routes every segment; DHCP for the thin clients; Secure Client headend; enforces per-user SGT rules; registers itself to your FMC at day 0
      config_file: configs/ftd2.json
      login:
        username: admin
        password: "{{ inputs.admin_password }}"
      x: 200
      y: -200
    - label: h3
      node_definition: ubuntu
      role: Thin client with an 802.1X EAP-TLS supplicant and an RDP client
      config_file: configs/h3.cfg
      x: -800
      y: -200
    - label: h4
      node_definition: ubuntu
      role: Second EAP-TLS thin client
      config_file: configs/h4.cfg
      x: -800
      y: 0
    - label: h5
      node_definition: alpine
      role: Thin client with no supplicant, admitted by MAB
      config_file: configs/h5.cfg
      x: -400
      y: 0
    - label: ums3
      node_definition: unmanaged_switch
      role: Data center segment (apps untagged, desktops on VLAN 20)
      x: 200
      y: 0
    - label: h6
      node_definition: ubuntu
      role: Finance VDI desktop (xrdp, XFCE, Secure Client)
      config_file: configs/h6.cfg
      ram_mb: 4096
      x: 0
      y: 200
    - label: h7
      node_definition: ubuntu
      role: General VDI desktop (xrdp, XFCE, Secure Client)
      config_file: configs/h7.cfg
      ram_mb: 4096
      x: 200
      y: 200
    - label: srv8
      node_definition: alpine
      role: Finance app (web page "srv8 FINANCE ONLY")
      config_file: configs/srv8.cfg
      x: 400
      y: 200
    - label: srv9
      node_definition: alpine
      role: General app (web page "srv9 GENERAL")
      config_file: configs/srv9.cfg
      x: 600
      y: 200
    - label: ums2
      node_definition: unmanaged_switch
      role: Package downloads for h3, h4, h6 and h7
      x: -400
      y: 400
    - label: ext2
      node_definition: external_connector
      role: Internet access for package downloads (CML NAT)
      config: NAT
      x: -400
      y: 600
  links:
    - a: ext1:port
      b: ums1:port0
      description: Management network, bridged out of CML
    - a: acc1:GigabitEthernet1/0/24
      b: ums1:port1
      description: acc1 management and RADIUS source
    - a: ftd2:Management0/0
      b: ums1:port2
      description: ftd2 management, how it reaches the FMC
    - a: ftd2:GigabitEthernet0/2
      b: ums1:port3
      description: ftd2 services (FMC Ethernet0/2), RADIUS and CoA with ISE
    - a: acc1:GigabitEthernet1/0/1
      b: ftd2:GigabitEthernet0/0
      description: Trunk, VLAN 110 (FMC Ethernet0/0, subinterface .110)
    - a: acc1:GigabitEthernet1/0/2
      b: h3:ens2
      description: Thin-client port, EAP-TLS
    - a: acc1:GigabitEthernet1/0/3
      b: h4:ens2
      description: Thin-client port, EAP-TLS
    - a: acc1:GigabitEthernet1/0/4
      b: h5:eth0
      description: Thin-client port, MAB
    - a: ftd2:GigabitEthernet0/1
      b: ums3:port0
      description: Inside untagged (apps) and outside VLAN 20 (desktops), FMC Ethernet0/1 and Ethernet0/1.20
    - a: srv8:eth0
      b: ums3:port1
      description: Finance app
    - a: srv9:eth0
      b: ums3:port2
      description: General app
    - a: h6:ens2
      b: ums3:port3
      description: Finance desktop, VLAN 20 tagged in the guest
    - a: h7:ens2
      b: ums3:port4
      description: General desktop, VLAN 20 tagged in the guest
    - a: h3:ens3
      b: ums2:port0
      description: h3 package downloads (NAT)
    - a: h4:ens3
      b: ums2:port1
      description: h4 package downloads (NAT)
    - a: h6:ens3
      b: ums2:port2
      description: h6 package downloads (NAT)
    - a: h7:ens3
      b: ums2:port3
      description: h7 package downloads (NAT)
    - a: ums2:port4
      b: ext2:port
      description: CML NAT

steps:
  - id: hosts-ready
    title: Wait for the thin clients and desktops to finish their setup
    mode: manual
    instructions: |
      h3, h4, h6 and h7 install their packages after boot (5-15 minutes; the desktops pull XFCE).
      Run tc-status on each until it shows "setup: ready". h3 and h4 have no address on ens2 yet:
      the access port stays closed until 802.1X succeeds.
      Don't re-cable acc1 or its neighbours while it runs: a cat9000v only forwards on links that
      existed when it booted. If you change a link, reboot acc1.
    verify: [h3-ready, h4-ready, h6-ready, h7-ready]
  - id: fmc-register
    title: Register ftd2 in your FMC
    mode: manual
    instructions: |
      ftd2 already points at your FMC from its day-0 config (show managers lists it as Pending).
      Pick the domain: FMC only registers devices in a leaf domain, so if it has child domains,
      create everything in this recipe in one of them. Nothing named TC-* should exist there yet.
      Create an access control policy TC-VDI-ACP with the default action Block All Traffic and no
      rules yet. Then Devices > Device Management > Add > Device: host {{ inputs.ftd2_mgmt_ip }},
      display name tc-ftd2, registration key cookbook, policy TC-VDI-ACP, performance tier FTDv5,
      licences Essentials and Secure Client Premier (RA VPN won't deploy without it). Wait for the
      registration and first deployment (about 6 minutes).
    verify: [ftd2-registered]
  - id: fmc-interfaces
    title: Configure ftd2's interfaces, DHCP and access rules
    mode: manual
    instructions: |
      Create four routed security zones: TC-THIN-CLIENTS, TC-VDI-OUTSIDE, TC-VDI-APPS and
      TC-VDI-SERVICES. Edit tc-ftd2 (FMC calls CML's GigabitEthernet0/x Ethernet0/x):
        - Ethernet0/0: enabled, no name, no address (it carries the trunk from acc1)
        - Ethernet0/0.110 (VLAN 110): name thinclients, zone TC-THIN-CLIENTS, 172.16.110.1/24
        - Ethernet0/1: name inside, zone TC-VDI-APPS, 172.16.30.1/24
        - Ethernet0/1.20 (VLAN 20): name outside, zone TC-VDI-OUTSIDE, 172.16.20.1/24
        - Ethernet0/2: name services, zone TC-VDI-SERVICES, {{ inputs.ftd2_services_ip }} with mask
          {{ inputs.mgmt_mask }}. If ISE ({{ inputs.ise_ip }}) isn't on that subnet, add a static route
          to it on services via {{ inputs.mgmt_gateway }}.
      DHCP server on thinclients: pool 172.16.110.100-172.16.110.199, no DNS needed.
      Network objects: TC-THIN-CLIENTS-NET 172.16.110.0/24, TC-VDI-DESKTOPS-NET 172.16.20.0/24,
      TC-APPS-NET 172.16.30.0/24, TC-FIN-APP 172.16.30.8, TC-GEN-APP 172.16.30.9.
      Add these rules to TC-VDI-ACP (the VPN rules come later):
        TC-ThinClient-RDP-to-desktops (logging at the end of the connection): zones TC-THIN-CLIENTS to TC-VDI-OUTSIDE, TC-THIN-CLIENTS-NET to
        TC-VDI-DESKTOPS-NET, TCP 3389, Allow
        TC-Block-to-apps-logged (last): destination zone TC-VDI-APPS, destination TC-APPS-NET, Block,
        logging at the beginning of the connection
      Deploy.
    verify: [ftd2-interfaces-up]
  - id: ise-base
    title: Add acc1 and ftd2 to ISE, and create the SGTs and the thin clients' dACL
    mode: manual
    instructions: |
      In ISE:
        - Network devices tc-acc1 ({{ inputs.acc1_mgmt_ip }}) and tc-ftd2
          ({{ inputs.ftd2_services_ip }}), RADIUS with the radius_key input as the shared secret.
          (ftd2 is matched by the address it sends from, its services interface.)
        - Security groups TC_Thin_Clients (140), TC_VDI_Finance (142) and TC_VDI_General (143).
          Let your FMC refresh its ISE SGTs (pxGrid) so they appear as SGT conditions.
        - Add the AD groups VDI-Finance and VDI-General to the AD join point.
        - Downloadable ACL TC-RDP-ONLY:
            permit udp any eq bootpc any eq bootps
            permit tcp any 172.16.20.0 0.0.0.255 eq 3389
            permit icmp any host 172.16.110.1
            deny ip any any
  - id: ise-wired-policy
    title: Build the thin-client policy set
    mode: manual
    instructions: |
      In ISE:
        - Certificate authentication profile TC_Cert_CN: identity from the subject Common Name.
        - Endpoint identity group TC_Thin_Clients_MAB.
        - Authorization profile TC_Access: Access-Accept, dACL TC-RDP-ONLY.
        - Policy set TC-Wired, condition Radius:NAS-IP-Address equals {{ inputs.acc1_mgmt_ip }},
          allowed protocols with EAP-TLS and Process Host Lookup:
            authentication: Dot1X -> TC_Cert_CN; MAB -> Internal Endpoints (if user not found: Reject)
            authorization (in order):
              TC-Thin-Client-EAP-TLS: Network Access:EapAuthentication equals EAP-TLS AND
                CERTIFICATE:Issuer - Common Name equals <your CA's name> AND
                CERTIFICATE:Subject - Organization Unit equals ThinClients
                -> TC_Access, security group TC_Thin_Clients
              TC-Thin-Client-MAB: Wired_MAB AND IdentityGroup:Name equals
                Endpoint Identity Groups:TC_Thin_Clients_MAB -> TC_Access, TC_Thin_Clients
              Default -> DenyAccess
  - id: thin-client-auth
    title: Give h3 and h4 their certificates, start 802.1X, and allow h5 by MAB
    mode: manual
    instructions: |
      h3 and h4 made a key and CSR at boot: /etc/eaptls/client.csr (subject O=cookbook,
      OU=ThinClients, CN=h3.{{ inputs.ad_domain }} / h4.{{ inputs.ad_domain }}). Have your CA sign
      each with a client-authentication template, then on each host write the certificate to
      /etc/eaptls/client.pem and the CA certificate to /etc/eaptls/ca.pem (PEM), and run
      sudo tc-dot1x. It starts wpa_supplicant on ens2, renews DHCP and runs tc-status.
      For h5, read its MAC (ip link show eth0 on h5) and add it to TC_Thin_Clients_MAB in ISE,
      then clear the session on acc1 (clear access-session interface GigabitEthernet1/0/4).
    verify: [h3-authorized, acc1-eap-tls-sessions, acc1-mab-session, h3-rdp-to-desktops, h3-apps-blocked, h6-apps-blocked-without-vpn]
  - id: fmc-ravpn
    title: Build the Secure Client VPN on ftd2
    mode: manual
    instructions: |
      In your FMC:
        - Identity certificate TC-VPN-ID for {{ inputs.vpn_fqdn }}, issued by your CA (PKCS12 or
          a CSR enrollment), and the CA as a trusted CA.
        - Upload the Secure Client Linux x64 webdeploy package (Objects > VPN > Secure Client File).
        - RADIUS server group TC-ISE-RADIUS: server {{ inputs.ise_ip }} with the radius_key input,
          dynamic authorization (CoA) on port 1799 or 1700 as your ISE sends, and the server
          reached through the specific interface services (not route lookup). With route lookup the
          FTD ignores ISE's CoA.
        - Address pool TC-VPN-POOL 172.16.40.10-172.16.40.200.
        - Group policies GP-Finance and GP-General: split tunnel, IPv4 tunnel networks specified,
          standard ACL TC-VDI-SPLIT (permit 172.16.30.0/24) only. No profile in the group policy:
          the desktops carry it locally.
        - RA VPN policy TC-VDI-RAVPN on tc-ftd2, access interface outside (zone TC-VDI-OUTSIDE),
          certificate TC-VPN-ID, and connection profile TC-VDI-VPN (alias VDI): AAA only,
          authentication, authorization and accounting TC-ISE-RADIUS, pool TC-VPN-POOL, group policy
          DfltGrpPolicy (ISE picks GP-Finance or GP-General through the Class attribute).
        - Leave "Bypass Access Control policy for decrypted traffic" off, so the SGT rules apply.
        - In TC-VDI-ACP, above TC-Block-to-apps-logged:
            TC-Finance-to-apps: zones TC-VDI-OUTSIDE to TC-VDI-APPS, source SGT TC_VDI_Finance,
            destination TC-FIN-APP and TC-GEN-APP, Allow
            TC-General-to-gen-app: same zones, source SGT TC_VDI_General, destination TC-GEN-APP, Allow
      Deploy.
  - id: ise-vpn-policy
    title: Build the VPN policy set
    mode: manual
    instructions: |
      In ISE:
        - Authorization profiles VPN_Finance (Radius:Class = GP-Finance) and VPN_General
          (Radius:Class = GP-General).
        - Policy set TC-VDI-VPN, condition Network Access:Device IP Address equals
          {{ inputs.ftd2_services_ip }} (Radius:NAS-IP-Address doesn't match an FTD's requests
          reliably), allowed protocols with PAP, authentication from your AD join point:
            TC-VPN-Finance: AD group VDI-Finance -> VPN_Finance, security group TC_VDI_Finance
            TC-VPN-General: AD group VDI-General -> VPN_General, security group TC_VDI_General
            Default -> DenyAccess
  - id: desktops-vpn
    title: Install Secure Client on the desktops and connect the two users
    mode: manual
    instructions: |
      Copy the full vpn package (cisco-secure-client-vpn_<version>_amd64.deb, from the Linux
      predeploy-deb .tgz) to h6 and h7 (for example over the NAT side: scp to the ens3 address from a
      host that reaches it, or wget from your own web server) and run
      sudo vdi-vpn-install /path/to/the.deb on each. It also installs the lab's local profile, which
      allows VPNs from remote (xrdp or SSH) sessions.
      On h6 run vdi-vpn connect {{ inputs.vpn_user_finance }}, and on h7 run
      vdi-vpn connect {{ inputs.vpn_user_general }}; each asks for the user's AD password. Wait about
      5 seconds after "state: Connected" before testing: the first flows can hit the block rule before
      ftd2 has the session's SGT.
    verify: [ftd2-vpn-sessions-sgt, h6-finance-reaches-both-apps, h7-general-reaches-only-srv9, h3-rdp-with-vpn-up]

checks:
  - id: h3-ready
    type: cli_match
    description: h3 installed wpa_supplicant and FreeRDP
    node: h3
    command: tc-status
    timeout: 1800
    expect:
      pattern: 'setup: ready'
  - id: h4-ready
    type: cli_match
    description: h4 installed wpa_supplicant and FreeRDP
    node: h4
    command: tc-status
    timeout: 1800
    expect:
      pattern: 'setup: ready'
  - id: h6-ready
    type: cli_match
    description: h6 runs xrdp and has its VLAN 20 address
    node: h6
    command: tc-status
    timeout: 1800
    expect:
      pattern: 'setup: ready[\s\S]*172\.16\.20\.6/24'
  - id: h7-ready
    type: cli_match
    description: h7 runs xrdp and has its VLAN 20 address
    node: h7
    command: tc-status
    timeout: 1800
    expect:
      pattern: 'setup: ready[\s\S]*172\.16\.20\.7/24'
  - id: ftd2-registered
    type: cli_match
    description: ftd2's registration with your FMC has completed
    node: ftd2
    command: show managers
    timeout: 900
    expect:
      pattern: 'Registration\s*:\s*Completed'
  - id: ftd2-interfaces-up
    type: cli_match
    description: ftd2 has its thin-client, outside, inside and services addresses
    node: ftd2
    command: show interface ip brief
    expect:
      pattern: '172\.16\.110\.1\s[\s\S]*172\.16\.30\.1\s[\s\S]*172\.16\.20\.1\s'
  - id: h3-authorized
    type: cli_match
    description: h3's 802.1X supplicant is authorized and ens2 has a thin-client address
    node: h3
    command: tc-status
    timeout: 300
    expect:
      pattern: 'suppPortStatus=Authorized[\s\S]*172\.16\.110\.1\d\d/24'
  - id: acc1-eap-tls-sessions
    type: cli_match
    description: acc1 has authorized 802.1X sessions for h3 and h4
    node: acc1
    command: show access-session
    timeout: 300
    expect:
      pattern: 'Gi1/0/2\s+\S+\s+dot1x\s+\S+\s+Auth[\s\S]*Gi1/0/3\s+\S+\s+dot1x\s+\S+\s+Auth'
  - id: acc1-mab-session
    type: cli_match
    description: acc1 authorized h5 by MAB with the same dACL
    node: acc1
    command: show access-session interface GigabitEthernet1/0/4 details
    timeout: 300
    expect:
      pattern: 'Status:\s+Authorized[\s\S]*TC-RDP-ONLY[\s\S]*mab\s+Authc Success'
  - id: h3-rdp-to-desktops
    type: cli_match
    description: A thin client reaches both desktops on RDP
    node: h3
    command: probe 172.16.20.6 3389; probe 172.16.20.7 3389
    expect:
      pattern: '172\.16\.20\.6:3389 open[\s\S]*172\.16\.20\.7:3389 open'
  - id: h3-apps-blocked
    type: cli_match
    description: A thin client reaches nothing else, the apps included (dACL and ftd2)
    node: h3
    command: probe 172.16.30.8 80; probe 172.16.30.9 80; probe 172.16.20.6 22
    expect:
      pattern: '172\.16\.30\.8:80 closed'
      not_pattern: ' open'
  - id: h6-apps-blocked-without-vpn
    type: cli_match
    description: Without the VPN, a desktop reaches neither app
    node: h6
    command: app-probe
    expect:
      pattern: '172\.16\.30\.8 http=000\s+172\.16\.30\.9 http=000'
  - id: ftd2-vpn-sessions-sgt
    type: cli_match
    description: ftd2 shows both users' VPN sessions with the group policy and SGT ISE chose
    node: ftd2
    command: show vpn-sessiondb anyconnect
    expect:
      pattern: 'Group Policy\s*:\s*GP-(Finance|General)[\s\S]*Security Grp\s*:\s*14[23][\s\S]*Group Policy\s*:\s*GP-(Finance|General)'
  - id: h6-finance-reaches-both-apps
    type: cli_match
    description: The Finance user's desktop reaches srv8 and srv9 through the VPN
    node: h6
    command: app-probe
    expect:
      pattern: '172\.16\.30\.8 http=200\s+172\.16\.30\.9 http=200'
  - id: h7-general-reaches-only-srv9
    type: cli_match
    description: The General user's desktop reaches srv9 but not srv8 (SGT 143)
    node: h7
    command: app-probe
    expect:
      pattern: '172\.16\.30\.8 http=000\s+172\.16\.30\.9 http=200'
  - id: h3-rdp-with-vpn-up
    type: cli_match
    description: Split tunnel keeps the desktops reachable on RDP while their VPN is up
    node: h3
    command: probe 172.16.20.6 3389; probe 172.16.20.7 3389
    expect:
      pattern: '172\.16\.20\.6:3389 open[\s\S]*172\.16\.20\.7:3389 open'
  - id: ise-coa-disconnect
    type: manual
    description: ISE can end a user's VPN session (CoA disconnect reaches ftd2)
    instructions: >-
      In ISE, Operations > RADIUS > Live Sessions, pick the Finance user's session from tc-ftd2 and
      choose CoA > Session termination. ftd2 answers with a Disconnect-ACK, ISE logs the accounting
      Stop, and show vpn-sessiondb anyconnect on ftd2 no longer lists the user.

