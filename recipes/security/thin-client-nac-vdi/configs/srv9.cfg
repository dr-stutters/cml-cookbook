# this is a shell script which will be sourced at boot
hostname srv9
USERNAME=cisco
PASSWORD=cisco
# App server on the inside segment: one web page, so a client can tell which app answered
ip link set eth0 up
ip addr add 172.16.30.9/24 dev eth0
ip route add default via 172.16.30.1
mkdir -p /www && echo 'srv9: GENERAL' > /www/index.html
(httpd -h /www -p 80 2>/dev/null || (while true; do printf 'HTTP/1.0 200 OK\r\n\r\nsrv9: GENERAL\n' | nc -l -p 80; done) &)
