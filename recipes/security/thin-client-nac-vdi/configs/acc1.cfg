hostname acc1
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa authentication dot1x default group radius
aaa authorization network default group radius
aaa accounting dot1x default start-stop group radius
aaa accounting update newinfo periodic 2880
aaa server radius dynamic-author
 client {{ inputs.ise_ip }} server-key {{ inputs.radius_key }}
radius server ISE
 address ipv4 {{ inputs.ise_ip }} auth-port 1812 acct-port 1813
 key {{ inputs.radius_key }}
radius-server attribute 6 on-for-login-auth
radius-server attribute 8 include-in-access-req
radius-server attribute 25 access-request include
radius-server vsa send authentication
radius-server vsa send accounting
radius-server dead-criteria time 5 tries 3
dot1x system-auth-control
!
device-tracking policy TC-DT
 tracking enable
!
class-map type control subscriber match-all TC-DOT1X-FAILED
 match method dot1x
 match result-type method dot1x authoritative
class-map type control subscriber match-all TC-DOT1X-NO-RESP
 match method dot1x
 match result-type method dot1x agent-not-found
class-map type control subscriber match-all TC-MAB-FAILED
 match method mab
 match result-type method mab authoritative
!
policy-map type control subscriber TC-DOT1X-THEN-MAB
 event session-started match-all
  10 class always do-until-failure
   10 authenticate using dot1x priority 10
 event authentication-failure match-first
  10 class TC-DOT1X-FAILED do-until-failure
   10 terminate dot1x
   20 authenticate using mab priority 20
  20 class TC-DOT1X-NO-RESP do-until-failure
   10 terminate dot1x
   20 authenticate using mab priority 20
  30 class TC-MAB-FAILED do-until-failure
   10 terminate mab
   20 authentication-restart 60
  40 class always do-until-failure
   10 terminate dot1x
   20 terminate mab
   30 authentication-restart 60
 event agent-found match-all
  10 class always do-until-failure
   10 terminate mab
   20 authenticate using dot1x priority 10
!
vlan 110
 name THIN-CLIENTS
!
interface GigabitEthernet1/0/1
 description to ftd2 GigabitEthernet0/0
 switchport mode trunk
 switchport trunk allowed vlan 110
 no shutdown
!
! One port at a time: a day-0 "interface range" on cat9000v only configures its first port.
interface GigabitEthernet1/0/2
 description to h3 ens2
 switchport mode access
 switchport access vlan 110
 device-tracking attach-policy TC-DT
 access-session host-mode single-host
 access-session closed
 access-session port-control auto
 mab
 dot1x pae authenticator
 dot1x timeout tx-period 5
 spanning-tree portfast
 service-policy type control subscriber TC-DOT1X-THEN-MAB
 no shutdown
!
interface GigabitEthernet1/0/3
 description to h4 ens2
 switchport mode access
 switchport access vlan 110
 device-tracking attach-policy TC-DT
 access-session host-mode single-host
 access-session closed
 access-session port-control auto
 mab
 dot1x pae authenticator
 dot1x timeout tx-period 5
 spanning-tree portfast
 service-policy type control subscriber TC-DOT1X-THEN-MAB
 no shutdown
!
interface GigabitEthernet1/0/4
 description to h5 eth0
 switchport mode access
 switchport access vlan 110
 device-tracking attach-policy TC-DT
 access-session host-mode single-host
 access-session closed
 access-session port-control auto
 mab
 dot1x pae authenticator
 dot1x timeout tx-period 5
 spanning-tree portfast
 service-policy type control subscriber TC-DOT1X-THEN-MAB
 no shutdown
!
interface GigabitEthernet1/0/24
 description to ums1 port1 (management and RADIUS source)
 no switchport
 ip address {{ inputs.acc1_mgmt_ip }} {{ inputs.mgmt_mask }}
 no shutdown
!
ip radius source-interface GigabitEthernet1/0/24
ip route 0.0.0.0 0.0.0.0 {{ inputs.mgmt_gateway }}
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
