#cloud-config
hostname: h4
manage_etc_hosts: true
system_info:
  default_user:
    name: cisco
password: cisco
chpasswd: {expire: false}
ssh_pwauth: true
write_files:
  # ens2 is the thin-client port on acc1 (802.1X); ens3 is CML NAT, only for package downloads.
  - path: /etc/netplan/60-lab.yaml
    content: |
      network:
        version: 2
        ethernets:
          ens2:
            dhcp4: true
            dhcp4-overrides: {use-routes: false, use-dns: false}
            routes: [{to: 172.16.0.0/16, via: 172.16.110.1}]
            optional: true
          ens3:
            dhcp4: true
            optional: true
  - path: /etc/wpa_supplicant/wpa_supplicant-wired-ens2.conf
    content: |
      ctrl_interface=/run/wpa_supplicant
      ap_scan=0
      network={
        key_mgmt=IEEE8021X
        eap=TLS
        identity="host/h4.{{ inputs.ad_domain }}"
        ca_cert="/etc/eaptls/ca.pem"
        client_cert="/etc/eaptls/client.pem"
        private_key="/etc/eaptls/client.key"
        eapol_flags=0
      }
  - path: /usr/local/sbin/tc-csr
    permissions: '0755'
    content: |
      #!/bin/sh
      # Key and CSR for the thin client's machine certificate; your CA signs /etc/eaptls/client.csr after boot.
      set -e
      d=/etc/eaptls; mkdir -p $d; cd $d
      [ -f client.key ] && exit 0
      openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj "/O=cookbook/OU=ThinClients/CN=h4.{{ inputs.ad_domain }}"
      chmod 600 client.key
  - path: /usr/local/sbin/tc-dot1x
    permissions: '0755'
    content: |
      #!/bin/sh
      # Start 802.1X on ens2 once /etc/eaptls/client.pem and ca.pem are in place, then renew DHCP.
      for f in client.pem ca.pem client.key; do [ -s /etc/eaptls/$f ] || { echo "missing /etc/eaptls/$f"; exit 1; }; done
      systemctl enable --now wpa_supplicant-wired@ens2
      sleep 10
      networkctl renew ens2
      sleep 5
      tc-status
  - path: /usr/local/bin/tc-status
    permissions: '0755'
    content: |
      #!/bin/sh
      # Setup state, 802.1X state on ens2 and the address the thin-client VLAN gave it
      if [ -f /var/lib/cloud/instance/boot-finished ] && { command -v xfreerdp || command -v xfreerdp3; } >/dev/null 2>&1; then echo "setup: ready"; else echo "setup: running"; fi
      wpa_cli -i ens2 status 2>/dev/null | grep -E '^(suppPortStatus|EAP state)=' || echo "suppPortStatus=not running"
      ip -4 -br addr show ens2
  - path: /usr/local/bin/probe
    permissions: '0755'
    content: |
      #!/bin/sh
      # probe <host> <port>: one TCP connect, prints "PROBE <host>:<port> open" or "... closed"
      if nc -z -w 3 "$1" "$2" 2>/dev/null; then echo "PROBE $1:$2 open"; else echo "PROBE $1:$2 closed"; fi
runcmd:
  - rm -f /etc/netplan/50-cloud-init.yaml
  - [sh, -c, "echo 'network: {config: disabled}' > /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg"]
  - chmod 600 /etc/netplan/60-lab.yaml
  - netplan apply
  - sleep 10
  - apt-get update
  - apt-get install -y wpasupplicant netcat-openbsd openssl
  - apt-get install -y freerdp2-x11 || apt-get install -y freerdp3-x11
  - /usr/local/sbin/tc-csr
