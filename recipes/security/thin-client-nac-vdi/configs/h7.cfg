#cloud-config
hostname: h7
# /etc/hosts carries the VPN headend's name, so cloud-init must not rewrite it at boot
manage_etc_hosts: false
system_info:
  default_user:
    name: cisco
password: cisco
chpasswd: {expire: false}
ssh_pwauth: true
write_files:
  # The desktop segment is VLAN 20, tagged in the guest on ens2 (ftd2's outside subinterface is the gateway).
  # ens2 untagged and ens3 untouched; ens3 is CML NAT, only for package downloads.
  - path: /etc/netplan/60-lab.yaml
    content: |
      network:
        version: 2
        ethernets:
          ens2:
            dhcp4: false
            optional: true
          ens3:
            dhcp4: true
            optional: true
        vlans:
          ens2.20:
            id: 20
            link: ens2
            addresses: [172.16.20.7/24]
            routes: [{to: 172.16.0.0/16, via: 172.16.20.1}]
  - path: /etc/skel/.xsession
    content: |
      xfce4-session
  - path: /etc/vdi-vpn/profile.xml
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!-- Secure Client profile for the VDI desktops: xrdp and SSH sessions are remote sessions -->
      <AnyConnectProfile xmlns="http://schemas.xmlsoap.org/encoding/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://schemas.xmlsoap.org/encoding/ AnyConnectProfile.xsd">
        <ClientInitialization>
          <UseStartBeforeLogon UserControllable="true">false</UseStartBeforeLogon>
          <AutomaticCertSelection UserControllable="true">true</AutomaticCertSelection>
          <ShowPreConnectMessage>false</ShowPreConnectMessage>
          <CertificateStore>All</CertificateStore>
          <CertificateStoreOverride>false</CertificateStoreOverride>
          <ProxySettings>Native</ProxySettings>
          <AllowLocalProxyConnections>true</AllowLocalProxyConnections>
          <AuthenticationTimeout>30</AuthenticationTimeout>
          <AutoConnectOnStart UserControllable="true">false</AutoConnectOnStart>
          <MinimizeOnConnect UserControllable="true">true</MinimizeOnConnect>
          <LocalLanAccess UserControllable="true">false</LocalLanAccess>
          <ClearSmartcardPin UserControllable="true">true</ClearSmartcardPin>
          <IPProtocolSupport>IPv4</IPProtocolSupport>
          <AutoReconnect UserControllable="false">true
            <AutoReconnectBehavior UserControllable="false">ReconnectAfterResume</AutoReconnectBehavior>
          </AutoReconnect>
          <SuspendOnConnectedStandby>false</SuspendOnConnectedStandby>
          <AutoUpdate UserControllable="false">true</AutoUpdate>
          <RSASecurIDIntegration UserControllable="false">Automatic</RSASecurIDIntegration>
          <WindowsLogonEnforcement>SingleLocalLogon</WindowsLogonEnforcement>
          <LinuxLogonEnforcement>SingleLocalLogon</LinuxLogonEnforcement>
          <WindowsVPNEstablishment>AllowRemoteUsers</WindowsVPNEstablishment>
          <LinuxVPNEstablishment>AllowRemoteUsers</LinuxVPNEstablishment>
          <AutomaticVPNPolicy>false</AutomaticVPNPolicy>
          <PPPExclusion UserControllable="false">Disable
            <PPPExclusionServerIP UserControllable="false"></PPPExclusionServerIP>
          </PPPExclusion>
          <EnableScripting UserControllable="false">false</EnableScripting>
          <EnableAutomaticServerSelection UserControllable="false">false
            <AutoServerSelectionImprovement>20</AutoServerSelectionImprovement>
            <AutoServerSelectionSuspendTime>4</AutoServerSelectionSuspendTime>
          </EnableAutomaticServerSelection>
          <RetainVpnOnLogoff>false</RetainVpnOnLogoff>
          <CaptivePortalRemediationBrowserFailover>false</CaptivePortalRemediationBrowserFailover>
          <AllowManualHostInput>true</AllowManualHostInput>
        </ClientInitialization>
        <ServerList>
          <HostEntry>
            <HostName>VDI-VPN</HostName>
            <HostAddress>{{ inputs.vpn_fqdn }}</HostAddress>
          </HostEntry>
        </ServerList>
      </AnyConnectProfile>
  - path: /usr/local/sbin/vdi-vpn-install
    permissions: '0755'
    content: |
      #!/bin/sh
      # vdi-vpn-install <cisco-secure-client-vpn_*.deb>: the full vpn package (vpn-cli conflicts with it),
      # then the local profile. The package is yours to download from Cisco; the recipe doesn't ship it.
      set -e
      [ -f "$1" ] || { echo "usage: vdi-vpn-install /path/to/cisco-secure-client-vpn_<version>_amd64.deb"; exit 1; }
      dpkg -i "$1" || apt-get install -f -y
      mkdir -p /opt/cisco/secureclient/vpn/profile
      cp /etc/vdi-vpn/profile.xml /opt/cisco/secureclient/vpn/profile/tc-vdi-vpn-profile.xml
      systemctl restart vpnagentd 2>/dev/null || true
      vdi-vpn status
  - path: /usr/local/bin/vdi-vpn
    permissions: '0755'
    content: |
      #!/bin/sh
      # vdi-vpn connect <AD user> | disconnect | status
      vpn=/opt/cisco/secureclient/bin/vpn
      [ -x $vpn ] || { echo "Secure Client not installed (run vdi-vpn-install)"; exit 1; }
      case "$1" in
        connect)
          [ -n "$2" ] || { echo "usage: vdi-vpn connect <user>"; exit 1; }
          printf 'Password for %s: ' "$2"; stty -echo 2>/dev/null; read -r pw; stty echo 2>/dev/null; echo
          # Order: host, user, password, accept the banner. No blank line for the group prompt (it is answered).
          printf 'connect %s\n%s\n%s\ny\n' "{{ inputs.vpn_fqdn }}" "$2" "$pw" | $vpn -s | grep -Ei 'state|error|login' | tail -5 ;;
        disconnect) $vpn disconnect | grep -i state | tail -2 ;;
        *) $vpn state | grep -m1 -i 'state:' ; ip -4 -br addr show | grep -E 'cscotun|tun' || true ;;
      esac
  - path: /usr/local/bin/app-probe
    permissions: '0755'
    content: |
      #!/bin/sh
      # HTTP status from each app server: 200 = reachable, 000 = blocked or timed out
      for a in 172.16.30.8 172.16.30.9; do printf '%s http=%s\n' "$a" "$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://$a/)"; done
  - path: /usr/local/bin/tc-status
    permissions: '0755'
    content: |
      #!/bin/sh
      if [ -f /var/lib/cloud/instance/boot-finished ] && systemctl is-active -q xrdp; then echo "setup: ready"; else echo "setup: running"; fi
      ip -4 -br addr show ens2.20
  - path: /usr/local/bin/probe
    permissions: '0755'
    content: |
      #!/bin/sh
      # probe <host> <port>: one TCP connect, prints "PROBE <host>:<port> open" or "... closed"
      if nc -z -w 3 "$1" "$2" 2>/dev/null; then echo "PROBE $1:$2 open"; else echo "PROBE $1:$2 closed"; fi
runcmd:
  - rm -f /etc/netplan/50-cloud-init.yaml
  - [sh, -c, "echo 'network: {config: disabled}' > /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg"]
  - chmod 600 /etc/netplan/60-lab.yaml
  - netplan apply
  - sleep 10
  - echo "172.16.20.1 {{ inputs.vpn_fqdn }}" >> /etc/hosts
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y xrdp xfce4 xfce4-terminal dbus-x11 curl netcat-openbsd
  - cp /etc/skel/.xsession /home/cisco/.xsession && chown cisco:cisco /home/cisco/.xsession
  - adduser xrdp ssl-cert
  - systemctl enable --now xrdp
