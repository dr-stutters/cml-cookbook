# this is a shell script which will be sourced at boot
hostname h8
# configurable user account
USERNAME=cisco
PASSWORD=cisco
# eth0: to ums2 to the hub pair's GigabitEthernet0/3 (the DC LAN; .1 is the active unit)
ip link set eth0 up
ip addr add 172.16.1.8/24 dev eth0
ip route add default via 172.16.1.1
