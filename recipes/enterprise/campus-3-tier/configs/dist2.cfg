hostname dist2
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
ip routing
!
vtp mode transparent
!
vlan 10
 name DATA
vlan 20
 name VOICE
vlan 99
 name MGMT
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,99 priority 24576
spanning-tree vlan 20 priority 28672
!
router ospf 1
 router-id 10.255.0.2
!
interface Loopback0
 description router ID
 ip address 10.255.0.2 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/1
 description to core1 Ethernet0/1
 no switchport
 ip address 10.1.2.2 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description to dist3 Ethernet0/2
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 no shutdown
!
interface Ethernet0/3
 description to acc4 Ethernet0/1
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 no shutdown
!
interface Ethernet1/0
 description to acc5 Ethernet0/1
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 no shutdown
!
interface Vlan10
 description DATA gateway
 ip address 172.16.10.2 255.255.255.0
 standby version 2
 standby 10 ip 172.16.10.1
 standby 10 priority 110
 standby 10 preempt
 ip ospf 1 area 0
 no shutdown
!
interface Vlan20
 description VOICE gateway
 ip address 172.16.20.2 255.255.255.0
 standby version 2
 standby 20 ip 172.16.20.1
 standby 20 preempt
 ip ospf 1 area 0
 no shutdown
!
interface Vlan99
 description MGMT gateway
 ip address 172.16.99.2 255.255.255.0
 standby version 2
 standby 99 ip 172.16.99.1
 standby 99 priority 110
 standby 99 preempt
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Vlan99
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
