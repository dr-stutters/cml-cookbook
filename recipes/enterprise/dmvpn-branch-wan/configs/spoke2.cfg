hostname spoke2
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
router ospf 1
 router-id 10.255.0.2
!
interface Loopback0
 description router ID
 ip address 10.255.0.2 255.255.255.255
 ip ospf 1 area 0
!
interface Loopback1
 description stand-in for the branch LAN
 ip address 172.16.2.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0
!
interface Ethernet0/1
 description to isp4 Ethernet0/2
 ip address 10.2.4.2 255.255.255.0
 no shutdown
!
interface Tunnel0
 description DMVPN spoke, NBMA address 10.2.4.2
 ip address 172.16.0.2 255.255.255.0
 no ip redirects
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip nhrp network-id 1
 ip nhrp nhs 172.16.0.1 nbma 10.1.4.1 multicast
 ip nhrp shortcut
 ip ospf network point-to-multipoint
 ip ospf 1 area 0
 tunnel source Ethernet0/1
 tunnel mode gre multipoint
!
ip route 0.0.0.0 0.0.0.0 10.2.4.4 name INTERNET
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
