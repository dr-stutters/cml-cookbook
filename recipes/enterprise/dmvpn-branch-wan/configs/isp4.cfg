hostname isp4
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
interface Ethernet0/1
 description to hub1 Ethernet0/1
 ip address 10.1.4.4 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 description to spoke2 Ethernet0/1
 ip address 10.2.4.4 255.255.255.0
 no shutdown
!
interface Ethernet0/3
 description to spoke3 Ethernet0/1
 ip address 10.3.4.4 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
