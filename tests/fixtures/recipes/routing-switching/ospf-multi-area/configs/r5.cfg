hostname r5
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
router ospf 1
 router-id 10.255.0.5
 area 2 stub
!
interface Loopback0
 description router ID
 ip address 10.255.0.5 255.255.255.255
 ip ospf 1 area 2
!
interface Loopback1
 description LAN inside area 2
 ip address 172.16.5.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 2
!
interface Ethernet0/1
 description to r3 Ethernet0/3
 ip address 10.3.5.5 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 2
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
