hostname r4
!
no ip domain lookup
username cisco privilege 15 secret cisco
enable secret cisco
!
router ospf 1
 router-id 10.255.0.4
 redistribute connected subnets route-map CONNECTED-TO-OSPF
!
interface Loopback0
 description router ID
 ip address 10.255.0.4 255.255.255.255
 ip ospf 1 area 1
!
interface Loopback1
 description simulated customer LAN, redistributed into OSPF
 ip address 172.16.4.1 255.255.255.0
!
interface Ethernet0/1
 description to r2 Ethernet0/3
 ip address 10.2.4.4 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 1
 no shutdown
!
route-map CONNECTED-TO-OSPF permit 10
 match interface Loopback1
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
!
end
